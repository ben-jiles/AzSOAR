[project]
name = "azsoar"
version = "0.1.0"
description = "Azure Sentinel SOAR Automation Framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Benjamin Jiles", email = "ben at cyphershell dot tech" }]   # Change as needed
keywords = ["azure", "sentinel", "soar", "security", "automation", "incident-response"]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "azure-identity>=1.25.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff", "mypy"]

[project.scripts]
azsoar = "azsoar.cli:app"

[tool.setuptools]
packages = ["azsoar"]          # Explicitly only include the 'azsoar' package
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.package-data]
azsoar = ["templates/**/*", "test/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["samples/*", "tests/*", "docs/*", "*.log", "playbooks/*"]
